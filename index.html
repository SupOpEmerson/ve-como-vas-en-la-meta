<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>¡Ve cómo vas en la Meta! · Unident</title>
<meta name="description" content="Avance de meta por clínica, monto atrasado, velocidad de venta y pacientes nuevos de Unident, actualizado varias veces al día.">
<meta property="og:title" content="¡Ve cómo vas en la Meta! 🎯">
<meta property="og:description" content="Tablero Unident: avance de meta por clínica, monto atrasado, velocidad de venta y pacientes nuevos.">
<meta property="og:type" content="website">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d232b;--mut:#6b7280;--line:#e3e5ea;--soft:#eceef2;--link:#2a4f8a;--navy:#1f3a68;
--r:#d93636;--y:#f2c200;--g:#2fa65a;--b:#2f6fd6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.page{max-width:1500px;margin:0 auto;padding:22px 16px 40px}
.ey{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
h1{font-family:Georgia,serif;font-weight:400;font-size:28px;margin:4px 0 16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.cols .card{margin-bottom:0}
h2{font-size:18px;font-weight:600;margin:0 0 4px}.sub{font-size:12.5px;color:var(--mut);margin:0 0 12px}
/* ranking */
.rrow{display:grid;grid-template-columns:44px minmax(110px,170px) 1fr 140px;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--soft)}
.rrow:last-child{border-bottom:0}.lead{display:flex;justify-content:center}
.pos{width:38px;height:38px;border-radius:50%;border:2px solid #c5c9d1;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:19px}
.nm{font-weight:700;font-size:19px}
.trk{position:relative;height:14px;background:var(--soft);border-radius:7px}
.pj{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--navy);opacity:.38}
.fl{position:absolute;inset:0 auto 0 0;border-radius:7px;transition:width 1s ease}
.mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--navy)}
.val{text-align:right;font-family:Georgia,serif;font-size:22px;font-weight:700}
.val small{display:block;font-family:Arial;font-size:13.5px;font-weight:700;color:var(--link)}
.st{display:block;font-family:Arial;font-size:13.5px;font-weight:700;color:var(--link)}
/* monto atrasado */
.semw{display:flex;align-items:center;gap:18px;margin-bottom:10px;flex-wrap:wrap}
.rules{font-size:12.5px;color:#4b5563;display:grid;gap:6px}.rules b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.mrow{display:grid;grid-template-columns:minmax(110px,170px) 1fr 160px 84px;align-items:center;gap:12px;padding:7px 0}
.mrow .trk{position:static}.mrow .fl{position:static;height:14px}
.mrow .val{font-size:20px}.mrow .val small{color:var(--mut);font-weight:600}
.chip{justify-self:end;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
@keyframes pulse{0%,100%{opacity:.25}33%{opacity:1}}
.luz{animation:pulse 3s infinite}.luz.l1{animation-delay:1s}.luz.l2{animation-delay:2s}
/* velocidad */
.vd{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;align-items:end}
.vdc{display:grid;gap:6px;justify-items:center;text-align:center}
.vdv{font-family:Georgia,serif;font-size:21px;font-weight:700}.vdn{font-size:16px;font-weight:700}
.vds{display:grid}.vds span{font-size:13px;color:#4b5563;font-weight:600}.vds b{font-size:17px}
.ndl{transition:transform 1.4s cubic-bezier(.3,1.4,.5,1)}
/* pacientes nuevos */
.pnhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.mbt{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.mbt button{border:0;background:#fff;padding:7px 16px;font-size:14px;font-weight:700;color:var(--mut);cursor:pointer}
.mbt button.on{background:var(--link);color:#fff}
.per{font-size:12.5px;color:var(--mut);margin:6px 0 10px}
.pnw{display:flex;gap:28px;align-items:flex-start}
.pnt{flex:1;width:100%;border-collapse:collapse}
.pnt th{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;padding:0 10px 9px;text-align:center;border-bottom:2px solid var(--line)}
.pnt td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--soft);font-family:Georgia,serif;font-size:21px;font-weight:700}
.pnt .pl{text-align:left;font-family:Arial}.pnt th.pl{font-size:12px}
.pnt td.pl button{all:unset;cursor:pointer;color:var(--link);font-size:18px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.pnt tr.sel td{background:#eef3fb}.pnt td.pz{color:#c3c7cf;font-weight:400}
.pnt tr.tot td{background:#f6f7f9;border-top:2px solid var(--line)}
.sp{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px}
.sp.r{background:var(--r)}.sp.y{background:var(--y)}.sp.g{background:var(--g)}.sp.b{background:var(--b)}.sp.n{background:#a3a8b3}
.pnk{display:grid;gap:10px;font-size:14px;color:#4b5563;padding:6px 16px;border-left:3px solid var(--line);min-width:230px}.pnk .sp{margin-right:8px;width:15px;height:15px}
.hint{font-size:13px;color:var(--mut);margin-top:10px}
#det{margin-top:16px;border-top:2px solid var(--line);padding-top:14px;display:none}
#det.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dh h3{margin:0;font-size:18px}.dh button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.kp{font-size:13px;color:var(--mut);margin:4px 0 10px}
.dt{width:100%;border-collapse:collapse;font-size:14px}
.dt th{font-size:11.5px;color:var(--mut);text-transform:uppercase;text-align:right;padding:6px;border-bottom:2px solid var(--line)}
.dt th:nth-child(-n+3){text-align:left}
.dt td{padding:7px 6px;border-bottom:1px solid var(--soft);text-align:right;vertical-align:top;white-space:nowrap}
.dt td.p{text-align:left;white-space:normal;font-weight:700}.dt td.f{text-align:left;color:var(--mut)}.dt td.c{text-align:left;width:22px}
.dt .m{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
.pnt td.scv{color:#d93636}.pnt th.scx{color:#d93636;font-size:10.5px;line-height:1.15}
.dt td.cm{text-align:left;font-size:12.5px;min-width:170px;max-width:260px;white-space:normal}.dt th.cmh{text-align:left}
.cmt{display:block;margin-bottom:4px;color:#374151;line-height:1.3}.cmt em{color:#6b7280;font-style:normal;font-size:11.5px}
.cmb{display:inline-block;font-size:12px;font-weight:600;color:#1d4ed8;text-decoration:none;border:1px solid #c7d2fe;border-radius:999px;padding:2px 9px;white-space:nowrap}.cmb:hover{background:#eef2ff}
.dt .cmm{display:none;margin-top:4px}
.dt td.px{text-align:left;font-size:13px;font-weight:600;white-space:normal;min-width:110px}.dt th.pxh{text-align:left}
.dt td.px.si,.dt .pxm.si{color:#1f7a44}.dt td.px.no,.dt .pxm.no{color:#d93636}.dt .pxm{display:none;font-size:12px;font-weight:600}
.dt .fi{font-weight:400;color:#6b7280;font-size:12px}.dt td.pp{color:var(--b);font-weight:700}.dt td.z{color:#c3c7cf}.dt tr.na td{color:#8a909b}
#cmx{position:fixed;inset:0;background:rgba(15,20,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#cmx.on{display:flex}.cbx{background:#fff;border-radius:14px;padding:18px;max-width:460px;width:100%;max-height:90vh;overflow:auto;text-align:left}
.chd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}.chd button{border:0;background:#f3f4f6;border-radius:999px;width:30px;height:30px;cursor:pointer;font-size:14px}
#cml{max-height:40vh;overflow:auto;margin-bottom:10px}.ci{border-left:3px solid #c7d2fe;padding:6px 10px;margin-bottom:8px;background:#f8fafc;border-radius:6px}
.ct{white-space:pre-wrap;font-size:14px;color:#111827}.cq{font-size:12px;color:#6b7280;margin-top:2px}.cv{font-size:13px;color:#6b7280;padding:6px 0}
#cmt,#cmq{width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;margin-bottom:8px}
.cft{display:flex;justify-content:space-between;align-items:center;gap:10px}#cme{font-size:12.5px;color:#374151}
#cmg{background:#1d4ed8;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}#cmg:disabled{opacity:.6}
.cnote{font-size:11.5px;color:#6b7280;margin-top:10px}.cmt{cursor:pointer}button.cmb{background:#fff;cursor:pointer;font:inherit;font-size:12px}
#lk{position:fixed;inset:0;background:rgba(15,20,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#lk.on{display:flex}.lg{background:#fff;border-radius:14px;padding:22px 20px;max-width:340px;width:100%;text-align:center}
.lg h3{margin:0 0 6px;font-size:19px}.lg p{color:var(--mut);font-size:13.5px;margin:0 0 14px}
.lg input[type=password]{width:100%;font-size:17px;padding:11px 12px;border:1px solid #c9cdd4;border-radius:8px}
.lg .bts{display:flex;gap:8px;margin-top:12px}.lg button{flex:1;font-size:15px;font-weight:700;padding:10px;border-radius:8px;cursor:pointer}
.lg .ok{border:0;background:var(--link);color:#fff}.lg .no{border:1px solid var(--line);background:#fff;color:var(--mut)}
.lg label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--mut);margin-top:10px}
.err{color:var(--r);font-size:13px;min-height:18px;margin-top:8px}.lock{font-size:12px;color:var(--mut);margin-left:4px}
@media (max-width:900px){
 .cols{grid-template-columns:1fr}.vd{grid-template-columns:repeat(2,1fr);gap:18px 10px}
 .pnw{flex-direction:column}.pnk{border-left:0;border-top:1px solid var(--line);min-width:0;grid-template-columns:1fr 1fr;padding:10px 0 0}
}
@media (max-width:600px){
 h1{font-size:22px}.page{padding:16px 12px 30px}.card{padding:14px 12px}
 .rrow{grid-template-columns:32px 1fr 92px;gap:8px}.rrow .trk{grid-column:2/4;grid-row:2}.pos{width:30px;height:30px;font-size:15px}.nm{font-size:16px}.val{font-size:18px}.val small,.st{font-size:11.5px}
 .mrow{grid-template-columns:1fr auto;gap:4px 8px}.mrow .trk{grid-column:1/3;grid-row:2}.mrow .nm{font-size:16px}.mrow .val{font-size:16px}.chip{grid-column:2;grid-row:3}
 .pnt th{padding:0 4px 8px;font-size:10px}.pnt td{padding:8px 4px;font-size:17px}.pnt td.pl button{font-size:15px}.sp{width:14px;height:14px}
 .dt td.px,.dt th.pxh,.dt td.cm,.dt th.cmh,.dt td.nac{display:none}.dt .pxm,.dt .cmm{display:block}
 .dt{font-size:12.5px}.dt th:nth-child(2),.dt td.f{display:none}.dt td{padding:6px 3px}
}
</style>
</head>
<body>

<div id="cmx"><form class="cbx" id="cmf" autocomplete="off"><div class="chd"><div><b>💬 Comentarios</b><div id="cmh" class="cq"></div></div><button type="button" id="cmc" aria-label="Cerrar">✕</button></div>
<div id="cml"></div>
<textarea id="cmt" rows="3" maxlength="1500" placeholder="Escribe tu comentario…"></textarea>
<input id="cmq" maxlength="80" placeholder="¿Quién comenta? (nombre y puesto)">
<div class="cft"><span id="cme"></span><button id="cmg" type="submit">Guardar comentario</button></div>
<div class="cnote">🔒 Se guarda cifrado con la contraseña del detalle. Los comentarios no se pueden borrar desde aquí.</div></form></div>
<div id="lk"><form class="lg" id="lf" autocomplete="off"><h3>🔒 Detalle de pacientes</h3><p>El detalle con nombres de pacientes es solo para personal autorizado. Escribe la contraseña.</p>
<input type="password" id="pw" placeholder="Contraseña"><label><input type="checkbox" id="rec"> Recordar en este equipo</label>
<div class="bts"><button type="button" class="no" id="lkno">Cancelar</button><button type="submit" class="ok" id="bt">Ver detalle</button></div><div class="err" id="er"></div></form></div>
<div class="page" id="app"><p style="color:#6b7280">Cargando tablero…</p></div>
<script>
const scn=v=>{v=Math.round(+v||0);return v?`<td class="scv">${v}</td>`:'<td class="pz">0</td>';};
const $=s=>document.querySelector(s);
let ULT='';
function cargar2(primera){
  fetch('datos.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{
    if(t===ULT) return; // sin cambios: no se repinta
    ULT=t; const y=window.scrollY; pintar(JSON.parse(t)); if(!primera) window.scrollTo(0,y);
  }).catch(()=>{ if(primera) $('#app').innerHTML='<p style="color:#d93636">No se pudieron cargar los datos. Revisa tu conexión y recarga la página.</p>'; });
}
cargar2(true);
setInterval(()=>cargar2(false), 120000); // revisa datos nuevos cada 2 minutos
/* ---------- detalle cifrado ---------- */
const b64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
let DET=null, ENC=null;
async function descifrar(pw){
  if(!ENC){const r=await fetch('detalle.enc.json?v='+Date.now(),{cache:'no-store'});ENC=await r.json();}
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const out=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct))));
  PW=pw; setTimeout(()=>cargarComs(),0); return out;
}
/* ---------- comentarios (Supabase, cifrados con la misma contraseña) ---------- */
const SBU='https://undblfctjjzvltxzwlii.supabase.co/rest/v1/comentarios', SBK='sb_publishable_hVb--DGuCG3B-dvdncUd6w_x0AriAdd';
let PW=null, CK=null, CM={}, CMOK=false, CMERR=false;
const enc=t=>new TextEncoder().encode(t), u8b64=u=>btoa(String.fromCharCode(...u));
async function ckey(){if(!CK){const base=await crypto.subtle.importKey('raw',enc(PW),'PBKDF2',false,['deriveKey']);CK=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc('unident-comentarios-v1'),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}return CK;}
async function kOf(f){const h=await crypto.subtle.digest('SHA-256',enc(PW+'|ficha|'+f));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
async function cargarComs(){
  if(!PW||!DET)return;
  try{
    const key=await ckey(), map={};
    for(const f of new Set(DET.map(x=>String(x.ficha||String(x.key||'').split('-')[0])))) map[await kOf(f)]=f;
    const r=await fetch(SBU+'?select=k,iv,ct,creado&order=creado.desc&limit=5000',{headers:{apikey:SBK},cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const rows=await r.json(), nuevo={};
    for(const w of rows){const f=map[w.k];if(!f)continue;
      try{const c=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(w.iv)},key,b64(w.ct))));c.f=w.creado;(nuevo[f]=nuevo[f]||[]).push(c);}catch(e){}}
    CM=nuevo;CMOK=true;CMERR=false;
  }catch(e){CMERR=true;}
  if(window.__rerender)window.__rerender(true);
  if($('#cmx').classList.contains('on'))pintarCm();
}
setInterval(()=>cargarComs(),120000);
const fh=iso=>{const d=new Date(iso);return d.toLocaleDateString('es-GT',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit'});};
let CMF=null, CMN='', CMS='';
function abrirCm(f,n,sd){CMF=f;CMN=n;CMS=sd;$('#cmx').classList.add('on');try{$('#cmq').value=localStorage.getItem('tu_quien')||''}catch(e){}$('#cmt').value='';$('#cme').textContent='';pintarCm();setTimeout(()=>$('#cmt').focus(),50);}
function pintarCm(){const l=CM[CMF]||[];$('#cmh').textContent=CMN+' · ficha '+CMF;
  $('#cml').innerHTML=l.length?l.map(c=>`<div class="ci"><div class="ct">${esc(c.t)}</div><div class="cq">${esc(c.q||'')} · ${esc(fh(c.f))}</div></div>`).join(''):`<div class="cv">${CMOK?'Todavía no hay comentarios para este paciente.':(CMERR?'No se pudieron cargar los comentarios guardados (revisa tu conexión).':'Cargando comentarios…')}</div>`;}
async function guardarCm(ev){ev.preventDefault();const t=$('#cmt').value.trim(),q=$('#cmq').value.trim();
  if(!t||!q){$('#cme').textContent='Escribe el comentario y quién comenta.';return;}
  $('#cmg').disabled=true;$('#cme').textContent='Guardando…';
  try{try{localStorage.setItem('tu_quien',q)}catch(e){}
    const key=await ckey(),iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc(JSON.stringify({t:t.slice(0,1500),q:q.slice(0,80),s:CMS}))));
    const r=await fetch(SBU,{method:'POST',headers:{apikey:SBK,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({k:await kOf(CMF),iv:u8b64(iv),ct:u8b64(ct)})});
    if(!r.ok)throw new Error(r.status);const w=(await r.json())[0]||{};
    (CM[CMF]=CM[CMF]||[]).unshift({t,q,s:CMS,f:w.creado||new Date().toISOString()});
    $('#cmt').value='';$('#cme').textContent='✅ Comentario guardado';pintarCm();if(window.__rerender)window.__rerender(true);
  }catch(e){$('#cme').textContent='No se pudo guardar. Revisa tu conexión e intenta de nuevo.';}
  $('#cmg').disabled=false;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-cmf]');if(b){e.preventDefault();abrirCm(b.dataset.cmf,b.dataset.cmn,b.dataset.cms);}});
$('#cmc').onclick=()=>$('#cmx').classList.remove('on');
$('#cmx').addEventListener('click',e=>{if(e.target.id==='cmx')$('#cmx').classList.remove('on');});
$('#cmf').onsubmit=guardarCm;
function pedirClave(){return new Promise(res=>{
  let pw=null;try{pw=localStorage.getItem('tu_pw')}catch(e){}
  if(pw){descifrar(pw).then(d=>{DET=d;res(true)}).catch(()=>{try{localStorage.removeItem('tu_pw')}catch(e){}abrir();});return;}
  abrir();
  function abrir(){$('#lk').classList.add('on');$('#er').textContent='';$('#pw').value='';setTimeout(()=>$('#pw').focus(),50);
    $('#lkno').onclick=()=>{$('#lk').classList.remove('on');res(false);};
    $('#lf').onsubmit=async ev=>{ev.preventDefault();$('#bt').disabled=true;$('#er').textContent='Abriendo…';
      try{DET=await descifrar($('#pw').value);if($('#rec').checked){try{localStorage.setItem('tu_pw',$('#pw').value)}catch(e){}}$('#lk').classList.remove('on');res(true);}
      catch(e){$('#er').textContent=ENC?'Contraseña incorrecta.':'No se pudo cargar el detalle. Revisa tu conexión.';}
      $('#bt').disabled=false;};}
});}

/* ---------- formato ---------- */
const f2=v=>(v<0?'-':'')+Math.abs(v).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/,/g,'X').replace(/\./g,',').replace(/X/g,'.');
const q0=v=>(v===null||v===undefined||v==='')?'—':'Q'+Number(v).toLocaleString('en-US',{maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titulo=s=>String(s||'').toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());

function pintar(D){
  const rows=D.graficas||[];
  /* ranking */
  const rk=[...rows].sort((a,b)=>b.avance-a.avance), cols=['#2e9e5b','#e0b100','#ef7d22'];
  const medal=[['#f3d36b','#c9971f','#3a2a00'],['#e6ebf1','#9aa5b3','#1f2630'],['#e2a674','#a8642f','#2c1607']];
  const msvg=i=>{const [a,b,ink]=medal[i];return `<svg width="32" height="42" viewBox="0 0 36 46"><defs><radialGradient id="m${i}" cx="38%" cy="32%" r="70%"><stop offset="0%" stop-color="#fff" stop-opacity=".85"/><stop offset="30%" stop-color="${a}"/><stop offset="100%" stop-color="${b}"/></radialGradient></defs><path d="M9 0 h7 l5 16 h-7 z" fill="#2f5fa8"/><path d="M27 0 h-7 l-5 16 h7 z" fill="#c23b3b"/><circle cx="18" cy="29" r="15" fill="url(#m${i})" stroke="${b}" stroke-width="1.5"/><text x="18" y="33.5" text-anchor="middle" font-size="13" font-weight="700" fill="${ink}" font-family="Georgia,serif">${i+1}</text></svg>`;};
  const pe=p=>{const r=Math.round(p*100)/100;return r>100?'Sobrepasa la meta':(r===100?'Sí cumplirá':'');};
  const atr=r=>Math.max(0,-r.al_dia);
  const rank=rk.map((r,i)=>{const c=i<3?cols[i]:'#d64545';const pos=(i<3&&atr(r)<6)?msvg(i):`<div class="pos">${i+1}</div>`;
    return `<div class="rrow"><div class="lead">${pos}</div><div class="nm">${esc(r.sede)}</div><div class="trk"><div class="pj" style="width:${Math.min(100,r.proyeccion)}%"></div><div class="fl" data-w="${Math.min(100,r.avance)}" style="width:0;background:${c}"></div><div class="mk" style="left:calc(${Math.min(100,r.proyeccion)}% - 1px)"></div></div><div class="val">${f2(r.avance)} %<small>Proy. ${f2(r.proyeccion)} %</small><span class="st">${pe(r.proyeccion)}</span></div></div>`;}).join('');
  /* monto atrasado */
  const lvl=a=>a>=12?['c','Crítico','#d93636']:(a>=6?['m','En riesgo','#f2c200']:['e','Alcanzable','#2fa65a']);
  const mo=[...rows].sort((a,b)=>atr(b)-atr(a)); const mx=Math.max(mo.length?atr(mo[0]):0,1e-9); const cnt={c:0,m:0,e:0};
  const mrows=mo.map(r=>{const [k,t,c]=lvl(atr(r));cnt[k]++;return `<div class="mrow"><div class="nm">${esc(r.sede)}</div><div class="trk"><div class="fl" data-w="${Math.max(2,atr(r)/mx*100)}" style="width:0;background:${c}"></div></div><div class="val">Q ${f2(Math.max(0,r.pendiente))}<small>${f2(atr(r))} % de su meta</small></div><div class="chip" style="background:${c};color:${k==='m'?'#3a2c00':'#fff'}">${t}</div></div>`;}).join('');
  const light=(cx,color,label,i)=>{let s='';const r=40,st=r/5.4;for(let a=-6;a<7;a++)for(let b=-6;b<7;b++){const x=cx+a*st,y=100+b*st;if((x-cx)**2+(y-100)**2<=(r-st*.6)**2)s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(st*.37).toFixed(2)}" fill="${color}"/>`;}
    return `<circle cx="${cx}" cy="100" r="${r+11}" fill="${color}" opacity=".35"/><circle cx="${cx}" cy="100" r="${r+4}" fill="#0d0d0d"/><g class="luz l${i}"><circle cx="${cx}" cy="100" r="${r}" fill="${color}" fill-opacity=".18"/>${s}</g><rect x="${cx-40}" y="90" width="80" height="20" rx="10" fill="#000" fill-opacity=".45"/><text x="${cx}" y="104.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff" font-family="Arial">${label}</text>`;};
  const sem=`<svg width="230" viewBox="0 0 380 180"><rect x="0" y="4" width="380" height="14" fill="#5F5E5A"/><rect x="186" y="18" width="9" height="20" fill="#5F5E5A"/><rect x="16" y="38" width="348" height="128" rx="16" fill="#2b2b2b"/>${light(85,'#ff3b30','Crítico',0)}${light(190,'#ffb300','En riesgo',1)}${light(295,'#00c96b','Alcanzable',2)}</svg>`;
  /* velocidad */
  const ritmo=r=>(typeof r.dias==='number'&&r.dias>0&&r.venta)?r.venta/r.dias:null;
  const vd=rows.filter(r=>typeof r.diario==='number'&&r.venta&&ritmo(r)).map(r=>[r,ritmo(r),ritmo(r)/r.diario*100]).sort((a,b)=>a[2]-b[2]);
  const lvb=p=>p>=200/3?['#2fa65a','#2fa65a']:(p>=50?['#f2c200','#9a7b00']:['#d93636','#d93636']);
  const gauge=([r,ra,p])=>{const [c,ink]=lvb(p),pp=Math.min(100,p);let arcs='';for(const [lo,hi,cc] of [[0,50,'#d93636'],[50,66.7,'#f2c200'],[66.7,100,'#2fa65a']]){const a0=Math.PI*(1-lo/100),a1=Math.PI*(1-hi/100);arcs+=`<path d="M${(60+50*Math.cos(a0)).toFixed(1)} ${(62-50*Math.sin(a0)).toFixed(1)} A50 50 0 0 1 ${(60+50*Math.cos(a1)).toFixed(1)} ${(62-50*Math.sin(a1)).toFixed(1)}" stroke="${cc}" stroke-width="12" fill="none"/>`;}
    return `<div class="vdc"><svg width="140" height="80" viewBox="0 0 120 70">${arcs}<line class="ndl" data-p="${pp.toFixed(2)}" x1="60" y1="62" x2="14" y2="62" style="transform-origin:60px 62px;transform:rotate(0deg)" stroke="#1d232b" stroke-width="3.5" stroke-linecap="round"/><circle cx="60" cy="62" r="5" fill="#1d232b"/></svg><div class="vdv" style="color:${ink}">${pp.toFixed(0)} %</div><div class="vdn">${esc(r.sede)}</div><div class="vds"><span>Vende por día</span><b>Q ${f2(ra)}</b></div><div class="vds"><span>Necesita por día</span><b>Q ${f2(r.diario)}</b></div></div>`;};
  const vdHtml=vd.length?`<div class="card"><h2>Velocidad de venta: ¿a qué ritmo va cada sede?</h2><p class="sub">La aguja marca qué % de la venta diaria necesaria logra hoy la sede. En verde va al ritmo; en rojo vende menos de la mitad de lo que necesita.</p><div class="vd">${vd.map(gauge).join('')}</div></div>`:'';

  $('#app').innerHTML=`<div class="ey">Datos al ${esc(D.fecha)} · actualizado ${esc(D.actualizado)} · se revisa solo cada 2 min</div><h1>Avance de meta por clínica · Unident</h1>
  <div class="cols"><div class="card"><h2>Posiciones por avance de venta</h2><p class="sub">% de la meta mensual vendido. Azul marino: proyección al cierre.</p>${rank}</div>
  <div class="card"><h2>Monto atrasado</h2><p class="sub">Lo que cada sede debe vender para alcanzar lo esperado a hoy.</p><div class="semw">${sem}<div class="rules"><div><b style="background:#d93636"></b>Crítico: atraso de 12 % o más de su meta (${cnt.c})</div><div><b style="background:#f2c200"></b>En riesgo: de 6 % a 11,99 % (${cnt.m})</div><div><b style="background:#2fa65a"></b>Alcanzable: menos de 6 % (${cnt.e})</div></div></div>${mrows}</div></div>
  <div style="height:16px"></div>${vdHtml}<div class="card" id="pn"></div>`;
  requestAnimationFrame(()=>setTimeout(()=>{document.querySelectorAll('.fl[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');document.querySelectorAll('.ndl').forEach(n=>n.style.transform=`rotate(${1.8*n.dataset.p}deg)`);},60));
  pacientes(D);
}

/* ---------- pacientes nuevos ---------- */
const ORDEN=["Unicentro","Peri-Roosevelt","Pacific Center","Real del Parque","Portales","Américas","Eskala","Santa Clara"];
const HOJA={"Periroosevelt":"Peri-Roosevelt","Pacific":"Pacific Center","Americas":"Américas"};
const COL={Rojo:'r',Amarillo:'y',Verde:'g',Azul:'b'};
function pacientes(D){
  const pn=D.pn||[]; const det=()=>(DET||[]).map(x=>Object.assign({},x,{sede:HOJA[x.sede]||x.sede}));
  const meses=[...new Map(pn.map(d=>[d.mes,d])).values()].sort((a,b)=>b.mes.localeCompare(a.mes));
  if(!meses.length){$('#pn').remove();return;}
  let mes=meses[0].mes, sel=null;
  const n=v=>{v=Math.round(+v||0);return v?`<td>${v}</td>`:'<td class="pz">0</td>';};
  function render(){
    const g=pn.filter(d=>d.mes===mes).sort((a,b)=>ORDEN.indexOf(a.sede)-ORDEN.indexOf(b.sede)); const m=g[0];
    const tot=k=>g.reduce((s,d)=>s+(+d[k]||0),0);
    $('#pn').innerHTML=`<div class="pnhead"><div><h2>Pacientes nuevos por clínica · ${esc(m.mes_label)}</h2></div><div class="mbt">${meses.map(x=>`<button data-m="${x.mes}" class="${x.mes===mes?'on':''}">${esc(x.mes_label.split(' ')[0])}</button>`).join('')}</div></div>
    <div class="per">${m.tipo==='actual'?'Mes actual':'Mes cerrado'} · pacientes nuevos atendidos del ${esc(m.periodo)}, según lo que pagaron frente a lo agendado. Sin ASYS.</div>
    <div class="pnw"><table class="pnt"><thead><tr><th class="pl">Clínica</th><th>PX nuevos</th><th class="scx">Sin próxima<br>cita</th><th><i class="sp r"></i></th><th><i class="sp y"></i></th><th><i class="sp g"></i></th><th><i class="sp b"></i></th></tr></thead><tbody>
    ${g.map(d=>`<tr class="${d.sede===sel?'sel':''}"><td class="pl"><button data-s="${esc(d.sede)}">${esc(d.sede)}</button></td>${n(d.atendidos)}${scn(d.sin_cita)}${n(d.rojo)}${n(d.amarillo)}${n(d.verde_total)}${n(d.azul)}</tr>`).join('')}
    <tr class="tot"><td class="pl">Total</td>${n(tot('atendidos'))}${scn(tot('sin_cita'))}${n(tot('rojo'))}${n(tot('amarillo'))}${n(tot('verde_total'))}${n(tot('azul'))}</tr></tbody></table>
    <div class="pnk"><div><i class="sp g"></i>Pagó más de lo agendado</div><div><i class="sp y"></i>Pagó igual</div><div><i class="sp r"></i>Pagó menos</div><div><i class="sp b"></i>Mejoró por seguimiento</div></div></div>
    <div class="hint">👆 Toca el nombre de una clínica para ver el detalle de sus pacientes <span class=\"lock\">🔒 requiere contraseña</span></div><div id="det"></div>`;
    $('#pn').querySelectorAll('.mbt button').forEach(b=>b.onclick=()=>{mes=b.dataset.m;render();});
    $('#pn').querySelectorAll('td.pl button').forEach(b=>b.onclick=async()=>{const s=b.dataset.s;if(sel===s){sel=null;render();return;}if(!DET&&!(await pedirClave()))return;sel=s;render();$('#det').scrollIntoView({behavior:'smooth',block:'start'});});
    if(sel) detalle(g.find(d=>d.sede===sel));
  }
  function detalle(d){
    if(!d)return;
    const fs=det().filter(x=>x.mes===mes&&x.sede===d.sede).sort((a,b)=>(a.fecha.split('/').reverse().join('')).localeCompare(b.fecha.split('/').reverse().join(''))||a.paciente.localeCompare(b.paciente));
    const at=fs.filter(x=>COL[x.color]), no=fs.filter(x=>!COL[x.color]);
    const pxt=x=>{const t=String(x.proxima||'');return t.replace(/(\d{2}\/\d{2})\/\d{4}/,'$1');};
    const pxc=x=>{const t=pxt(x);if(!t)return '<td class="px"></td>';return t.startsWith('Sin')?'<td class="px no">Sin próxima cita</td>':`<td class="px si">📅 ${esc(t)}</td>`;};
    const pxm=x=>{const t=pxt(x);if(!t)return '';return t.startsWith('Sin')?'<span class="pxm no">✕ Sin próxima cita</span>':`<span class="pxm si">📅 Próxima cita: ${esc(t)}</span>`;};
    const cmList=x=>{const l=CM[x.ficha]||[];if(!l.length)return '';const c=l[0];const t=c.t.length>70?c.t.slice(0,70)+'…':c.t;return `<span class="cmt" data-cmf="${esc(x.ficha)}" data-cmn="${esc(titulo(x.paciente))}" data-cms="${esc(d.sede)}">“${esc(t)}”<em> — ${esc(c.q||'')}, ${esc(fh(c.f))}</em></span>`;};
    const cmBtn=x=>{const n=(CM[x.ficha]||[]).length;return `<button class="cmb" data-cmf="${esc(x.ficha)}" data-cmn="${esc(titulo(x.paciente))}" data-cms="${esc(d.sede)}">💬 ${n?'Ver comentarios ('+n+')':'Comentar'}</button>`;};
    const cmc=x=>`<td class="cm">${cmList(x)}${cmBtn(x)}</td>`;
    const cmm=x=>`<span class="cmm">${cmList(x)}${cmBtn(x)}</span>`;
    const fila=x=>`<tr><td class="c"><i class="sp ${COL[x.color]}"></i></td><td class="f">${esc(x.fecha.slice(0,5))}</td><td class="p">${esc(titulo(x.paciente))} <span class="fi">· ficha ${esc(x.ficha)}</span><span class="m">${esc(x.motivo)}</span>${pxm(x)}${cmm(x)}</td>${pxc(x)}<td>${q0(x.agendado)}</td><td>${q0(x.pagado)}</td>${x.posterior?`<td class="pp">${q0(x.posterior)}</td>`:'<td class="z">—</td>'}${cmc(x)}</tr>`;
    const filaNo=x=>`<tr class="na"><td class="c"><i class="sp n"></i></td><td class="f">${esc(x.fecha.slice(0,5))}</td><td class="p">${esc(titulo(x.paciente))} <span class="fi">· ficha ${esc(x.ficha)}</span><span class="m">${esc(x.estado)}</span>${pxm(x)}${cmm(x)}</td>${pxc(x)}<td class="nac" colspan="3"></td>${cmc(x)}</tr>`;
    $('#det').innerHTML=`<div class="dh"><h3>${esc(d.sede)} · ${esc(d.mes_label)}</h3><button id="cerrar">Cerrar ✕</button></div>
    <div class="kp"><b>${Math.round(d.atendidos)}</b> nuevos atendidos de ${Math.round(d.agendados)} agendados · pagado 1ª cita ${q0(d.pagado)} · pagos después ${q0(d.posterior)} · <b style="color:#d93636">${Math.round(d.sin_cita||0)} sin próxima cita</b></div>
    <table class="dt"><thead><tr><th></th><th>Fecha</th><th>Paciente · motivo</th><th class="pxh">Próxima cita</th><th>Agend.</th><th>Pagó</th><th>Después</th><th class="cmh">Comentario</th></tr></thead><tbody>${at.map(fila).join('')}
    ${no.length?`<tr><td colspan="8" style="text-align:left;padding-top:14px;font-weight:700;color:#6b7280">No asistieron / cancelaron (${no.length})</td></tr>${no.map(filaNo).join('')}`:''}</tbody></table>`;
    $('#det').classList.add('on');
    $('#cerrar').onclick=()=>{sel=null;render();$('#pn').scrollIntoView({behavior:'smooth'});};
  }
  window.__rerender=(keep)=>{if(!keep||sel)render();};
  render();
}
</script>
</body>
